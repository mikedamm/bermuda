{{define "content"}}{{$v := .Body}}
<div class="wrap page-empty">
	<h1>Nothing to show here</h1>
	<p>{{$v.Message}}</p>
	<form class="find find-big" action="/tracker/search" method="get" role="search">
		<label class="vh" for="q3">Flight number, tail number or airport</label>
		<input id="q3" name="q" type="search" value="{{$v.Query}}" placeholder="UA1275, N527AS or SEA" autocomplete="off" autocapitalize="characters" spellcheck="false">
		<button type="submit">Track</button>
	</form>
</div>
{{end}}
